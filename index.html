<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animation Prints — Turn memories into art</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#faf8f5;color:#171717}header{padding:24px 6%;display:flex;justify-content:space-between;align-items:center}header strong{font-size:20px}header span{color:#777;font-size:14px}.hero{max-width:1040px;margin:35px auto;padding:0 22px}.hero h1{text-align:center;font-size:clamp(42px,7vw,72px);line-height:.98;letter-spacing:-3px;margin:0 0 16px}.hero>p{text-align:center;color:#666;font-size:18px;max-width:680px;margin:0 auto 32px}.card{background:#fff;border:1px solid #e7e1d9;border-radius:26px;padding:28px;box-shadow:0 18px 60px #0000000b}.drop{display:block;border:2px dashed #d2c9bf;border-radius:18px;padding:42px 20px;text-align:center;cursor:pointer}.drop:hover{border-color:#171717}.drop input{display:none}.drop b{display:block;font-size:21px;margin-bottom:7px}.drop small{color:#777}.section{margin-top:26px}.section h3{margin:0 0 12px}.chips{display:flex;flex-wrap:wrap;gap:9px}.chip{border:1px solid #ddd6ce;border-radius:999px;padding:10px 14px;background:#fff;cursor:pointer}.chip.active{background:#171717;color:#fff;border-color:#171717}.scenes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.scene{border:1px solid #ddd6ce;background:#faf8f5;border-radius:14px;padding:15px;text-align:center;cursor:pointer}.scene.active{outline:2px solid #171717;background:#fff}.products{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.product{border:1px solid #ddd6ce;border-radius:14px;padding:16px 8px;text-align:center;cursor:pointer;background:#fff}.product.active{background:#171717;color:#fff}.preview{margin-top:26px;background:#f4f0ea;border-radius:20px;min-height:260px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.preview img{max-width:100%;max-height:520px;display:none}.empty{text-align:center;color:#777;padding:30px}.cta{width:100%;margin-top:18px;padding:16px;border:0;border-radius:13px;background:#171717;color:#fff;font-size:16px;font-weight:650;cursor:pointer}.cta:disabled{opacity:.45;cursor:not-allowed}.status{text-align:center;color:#666;margin:12px 0 0;min-height:20px}@media(max-width:700px){.scenes{grid-template-columns:repeat(2,1fr)}.products{grid-template-columns:repeat(2,1fr)}header span{display:none}}
</style></head>
<body>
<header><strong>✦ Animation Prints</strong><span>Turn memories into art</span></header>
<main class="hero"><h1>Your photo.<br>Reimagined.</h1><p>Create a personalised illustrated memory, choose the scene, then see how it could look on a real product.</p>
<section class="card">
<label class="drop" for="photo"><b>Upload a photo</b><small>JPG, PNG or WEBP · One clear photo works best</small><input id="photo" type="file" accept="image/*"></label>
<div class="section" id="styleSection"><h3>1. Choose an illustration style</h3><div class="chips" id="styles"></div></div>
<div class="section" id="sceneSection"><h3>2. Choose a scene</h3><div class="scenes" id="scenes"></div></div>
<div class="section" id="productSection"><h3>3. Choose a product</h3><div class="products" id="products"></div></div>
<div class="preview"><div class="empty" id="empty">Your artwork preview will appear here</div><img id="preview" alt="Artwork preview"></div>
<button class="cta" id="create" disabled>Create my artwork →</button><div class="status" id="status"></div>
</section></main>
<script>
const styles=['Anime','Fairytale Animation','3D Cartoon','Comic Book','Chibi','Watercolour','Pencil Illustration','Pop Art'];
const scenes=['Keep original','Beach','Christmas','Football','Birthday','Travel','Custom'];
const products=['T-shirt','Hoodie','Mug','Canvas','Poster'];
let selected={style:'Fairytale Animation',scene:'Keep original',product:'Canvas'},photoFile=null;
function render(list,id,key,cls){const el=document.getElementById(id);el.innerHTML=list.map(x=>`<button class="${cls} ${x===selected[key]?'active':''}" data-value="${x}">${x}</button>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected[key]=b.dataset.value;render(list,id,key,cls);check()})}
render(styles,'styles','style','chip');render(scenes,'scenes','scene','scene');render(products,'products','product','product');
const input=document.getElementById('photo'),preview=document.getElementById('preview'),empty=document.getElementById('empty'),create=document.getElementById('create'),status=document.getElementById('status');
input.onchange=()=>{const f=input.files[0];if(!f)return;photoFile=f;preview.src=URL.createObjectURL(f);preview.style.display='block';empty.style.display='none';status.textContent='Photo ready. Choose your options, then create your artwork.';check()};
function check(){create.disabled=!photoFile}
function fileToDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
create.onclick=async()=>{if(!photoFile)return;create.disabled=true;create.textContent='Creating your artwork…';status.textContent='AI is transforming your photo — this can take a little while.';try{const image=await fileToDataUrl(photoFile);const response=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image,style:selected.style,scene:selected.scene})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Image generation failed.');preview.src=data.image;preview.alt=`Generated ${selected.style} artwork`;preview.style.display='block';empty.style.display='none';status.textContent=`Artwork created · ${selected.style} · ${selected.scene}`;}catch(error){console.error(error);status.textContent=error.message||'We could not create the artwork. Please try again.'}finally{create.textContent='Create my artwork →';create.disabled=false}};
</script></body></html>
